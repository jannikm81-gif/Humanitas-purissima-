name: HP-v10 Invarianten-Schutz-Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python 3.10 einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Abhaengigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Mathematische Invarianten-Suite ausfuehren
      env:
        PYTHONPATH: .
      run: |
        python -m unittest tests/test_oracle_resilience.py
        python -m unittest tests/test_dkdp_crypto.py
        python -m unittest tests/test_ztil_system.py
        python -m unittest tests/test_exil_system.py
        python -m unittest tests/test_constitution.py
        python -m unittest tests/test_freiraum.py
